image: docker.uib.gmbh/opsi/dev/pybuilder:uib-python-3.10

stages:
  - test
  - build
  - publish


pytest-pylint:
  stage: test
  script:
    - apt -y install python3-newt gettext gzip asciidoc-base
    - poetry config experimental.new-installer false
    - poetry lock --no-update
    - poetry install
    - poetry run pylint --disable=R,fixme opsiutils

integration_test:
  services:
    - name: mysql:latest
      command:
        - --max_connections=1000
        - --default-authentication-plugin=mysql_native_password
    - name: redislabs/redistimeseries:latest
      alias: redis
    #- name: docker.uib.gmbh/opsi/opsi-server:4.3-development
    #  alias: opsi-server
  variables:
    MYSQL_ROOT_PASSWORD: "opsi"
    MYSQL_DATABASE: "opsitest"
    MYSQL_USER: "opsi"
    MYSQL_PASSWORD: "opsi"
    MYSQL_HOST: mysql
    REDIS_HOST: redis
    OPSI_ADMIN_PASSWORD: vhahd8usaz
    OPSI_HOST_ROLE: configserver
    OPSI_TFTPBOOT: "false"
    OPSICONFD_LOG_LEVEL: 6
    # OPSICONFD_RESTORE_BACKUP_URL: ${OPSICONFD_RESTORE_BACKUP_URL:-}
    # OPSILICSRV_URL: ${OPSILICSRV_URL:-}
    # OPSILICSRV_TOKEN: ${OPSILICSRV_TOKEN:-}
  stage: test
  image: docker.uib.gmbh/opsi/opsi-server:4.3-development
  script:
    - ps -A
    - pwd
    - ls -lah


linux-pyinstaller:
  stage: build
  script:
    - apt -y install python3-newt gettext gzip asciidoc-base
    - poetry config experimental.new-installer false
    - poetry lock --no-update
    - poetry install
    - poetry run opsi-dev-cli -l info pyinstaller build
    - '[ "$CI_COMMIT_TAG" = "" ] && poetry run opsi-dev-cli -l info binary push dist/opsi-utils --prerelease="$CI_JOB_ID"'
    - '[ "$CI_COMMIT_TAG" = "" ] || poetry run opsi-dev-cli -l info binary push dist/opsi-utils'
    - mv dist/opsi-utils ./opsi-utils-amd64
    # Check if binary is working
    - opsi-utils-amd64/opsi-admin --version
    - opsi-dev-cli -l info binary pull
    - mv opsi-cli opsi-utils-amd64
  artifacts:
    name: 'opsi-utils-linux-pyinstaller'
    paths:
      - opsi-utils-amd64
    expire_in: 2 days

arm64-pyinstaller:
  stage: build
  tags:
    - arm64
  script:
    - apt -y install python3-newt gettext gzip asciidoc-base
    - poetry config experimental.new-installer false
    - poetry lock --no-update
    - poetry install
    - poetry run opsi-dev-cli -l info pyinstaller build
    - mv dist/opsi-utils ./opsi-utils-arm64
    # Check if binary is working
    - OPSI_HOSTNAME=test.uib.local opsi-utils-arm64/opsi-admin --version
    - opsi-dev-cli -l info binary pull
    - mv opsi-cli opsi-utils-arm64
  artifacts:
    name: 'opsi-utils-arm64-pyinstaller'
    paths:
      - opsi-utils-arm64
    expire_in: 2 days


obs_int:
  stage: publish
  script:
    - opsi-dev-tool -l info --obs-update-package https://obs.uib.gmbh home:uibmz:opsi:4.2:development
  only:
    - tags

obs_ext:
  stage: publish
  script:
    - opsi-dev-tool -l info --obs-update-package https://build.opensuse.org home:uibmz:opsi:4.2:development
  only:
    - tags
