transifex:
  upload_resources:
    - organization: opsi-org
      project: opsiorg
      resource_name: opsi-utils.pot
      scan_sources:
        - opsiutils
  download_translations:
    - organization: opsi-org
      project: opsiorg
      resource_name: opsi-utils.pot
      install_dir: opsiutils_data/locale
      min_review_rate: $TRANSIFEX_MIN_REVIEW_RATE
      languages:
        - de
        - fr

pyinstaller:
  one_file: no
  strip: yes
  hidden_imports:
    all:
      - OPSI.Backend.DHCPD
      - OPSI.Backend.File
      - OPSI.Backend.HostControl
      - OPSI.Backend.HostControlSafe
      - OPSI.Backend.JSONRPC
      - OPSI.Backend.MySQL
      - OPSI.Backend.OpsiPXEConfd
      - OPSI.Backend.Replicator
      - OPSI.Backend.SQLite
      - OPSI.Util.Ping
      - OPSI.Util.WIM
      - snack
      - distro
      - OPSI.Logger
      # make packages available in opsi-python
      - paramiko
    windows: []
    linux: []
    darwin: []
  additional_hooks_dirs:
    - import_hooks
  dirname: opsi-utils
  scripts:
    - script: opsiutils/__main__.py
      binaries:
        - opsi-admin
        - opsi-backup
        - opsi-convert
        - opsi-makepackage
        - opsi-newprod
        - opsi-package-manager
        - opsi-package-updater
        - opsi-setup
        - opsi-python
        - opsi-wakeup-clients
        - opsi-outdated-to-setup
  data_files:
    - src: opsiutils_data/**/*
      dst: opsiutils_data
  before_script: |
    dpkg -l python3-newt >/dev/null 2>&1 || apt -y install python3-newt
    pyver1=$(ls -ld .venv/lib/python* | sed s'/.*python//')
    pyver2=$(echo $pyver1 | sed s'/\.//')
    src=$(ls /usr/lib/python3/dist-packages/_snack.cpython-*-x86_64-linux-gnu.so | head -n1)
    if [ -z "$src" ]; then
      src=$(ls /usr/lib/python3/dist-packages/_snack.cpython-*-aarch64-linux-gnu.so | head -n1);
    fi
    dst=.venv/lib/python${pyver1}/site-packages/$(basename $src | sed -E s"/-[0-9]+m/-${pyver2}/g")
    cp $src $dst
    cp /usr/lib/python3/dist-packages/snack.py .venv/lib/python${pyver1}/site-packages/snack.py
  manpages_install: _internal/opsiutils_data/manpages
  after_script:
    linux: |
      find dist/opsi-utils/_internal -iname "*.c" -delete
      find dist/opsi-utils/_internal -iname "*.h" -delete
      find dist/opsi-utils/_internal -iname "*.so" -exec chmod -x "{}" \;
      find dist/opsi-utils/_internal -iname "*.so.*" -exec chmod -x "{}" \;
    darwin: |
      find dist/opsi-utils/_internal -iname "*.c" -delete
      find dist/opsi-utils/_internal -iname "*.h" -delete
      find dist/opsi-utils/_internal -iname "*.so" -exec chmod -x "{}" \;
      find dist/opsi-utils/_internal -iname "*.so.*" -exec chmod -x "{}" \;

package:
  name: opsi-utils
  type: binary
  depends:
    - pigz
    - librsync | librsync2 | librsync1
    - cpio
  conflicts:
    - opsi-server (<< 4.2)
    - opsi-server-expert (<< 4.2)
    - opsi-depotserver (<< 4.2)
    - opsi4ucs (<< 4.2)
  source_script: |
    mkdir -p ${DST}/rootfs/usr/bin
    mkdir -p ${DST}/rootfs/usr/lib
    mkdir -p ${DST}/rootfs/usr/share/man/man1
    mkdir -p ${DST}/rootfs/usr/share/opsi-utils

    for i in opsi-admin opsi-backup opsi-convert opsi-makepackage opsi-newprod opsi-outdated-to-setup opsi-package-manager opsi-package-updater opsi-python opsi-setup opsi-wakeup-clients; do
       echo "#!/bin/sh"                            > ${DST}/rootfs/usr/bin/$i
       echo "exec /usr/lib/opsi-utils/$i \"\$@\"" >> ${DST}/rootfs/usr/bin/$i
       chmod 755 ${DST}/rootfs/usr/bin/$i
    done

    echo "#!/bin/sh"                                                  > ${DST}/rootfs/usr/bin/opsi-set-rights
    echo "[ \"\$(id -u)\" -eq 0 ] || exec sudo \$0 \"\$@\""          >> ${DST}/rootfs/usr/bin/opsi-set-rights
    echo "exec /usr/lib/opsi-utils/opsi-setup --set-rights \"\$@\""  >> ${DST}/rootfs/usr/bin/opsi-set-rights
    chmod 755 ${DST}/rootfs/usr/bin/opsi-set-rights

    for arch in amd64 arm64; do
      arch_src="${SRC}/opsi-utils-${arch}"
      arch_dst="${DST}/rootfs-${arch}"

      mkdir -p ${arch_dst}/usr/lib ${arch_dst}/usr/bin
      cp -a ${arch_src} ${arch_dst}/usr/lib/opsi-utils
      mv ${arch_dst}/usr/lib/opsi-utils/opsi-cli ${arch_dst}/usr/bin/opsi-cli

      cp -a ${arch_src}/_internal/opsiutils_data/manpages/* ${DST}/rootfs/usr/share/man/man1/
      cp -a ${arch_src}/_internal/opsiutils_data/etc ${DST}/rootfs/
      cp -a ${arch_src}/_internal/opsiutils_data/opsi-python-examples ${DST}/rootfs/usr/share/opsi-utils/
    done

  postinst_script: |
    # Remove obsolete files
    cd /usr/lib/opsi-utils
    for file in /usr/lib/opsi-utils/*; do
      [[ $file = */_internal ]] || \
      [[ $file = */opsi-admin ]] || \
      [[ $file = */opsi-backup ]] || \
      [[ $file = */opsi-convert ]] || \
      [[ $file = */opsi-makepackage ]] || \
      [[ $file = */opsi-newprod ]] || \
      [[ $file = */opsi-outdated-to-setup ]] || \
      [[ $file = */opsi-package-manager ]] || \
      [[ $file = */opsi-package-updater ]] || \
      [[ $file = */opsi-python ]] || \
      [[ $file = */opsi-setup ]] || \
      [[ $file = */opsi-wakeup-clients ]] || \
        rm -r "$file" || true
    done

    dist="unknown"
    [ -f /etc/os-release ] && dist=$(grep PRETTY_NAME /etc/os-release | cut -d'"' -f2)

    # Distribution specific workarounds
    if [[ "$dist" =~ "SUSE Linux Enterprise Server 15 SP1" ]]; then
      # /bin/sh: /usr/lib/opsi-utils/libreadline.so.7: no version information available (required by /bin/sh)
      cp /lib64/libreadline.so.7 /usr/lib/opsi-utils/_internal/libreadline.so.7
    fi

    # Use pam_unix.so from system
    # Authentication failure (auth_type=auth-module)...
    # ARM64: ubuntu: /usr/lib/aarch64-linux-gnu, debian: /lib/aarch64-linux-gnu
    for libdir in /usr/lib/x86_64-linux-gnu /lib/x86_64-linux-gnu /lib64  /usr/lib/aarch64-linux-gnu /lib/aarch64-linux-gnu; do
      [ -e ${libdir}/libpam.so.0 ] && cp ${libdir}/libpam.so.0 /usr/lib/opsi-utils/_internal/libpam.so.0
    done

    # Remove obsolete files
    for file in "/etc/logrotate.d/opsi-product-updater" "/etc/logrotate.d/opsi-backup"; do
      if [ -e $file ]; then
        rm -f $file
      fi
    done


    exit 0

# os and architecture omitted -> defaulting to current machines values
pull-binaries:
  - name: opsi-cli
    server-type: binaryindex
    destination: .
    extract: true
    post-script:
      - mv opsi-cli-linux-*.run opsi-cli
    version: 4.3.29.0
    server-url: http://binaryindex.uib.gmbh
